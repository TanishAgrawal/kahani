<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Coherent</title>
	<style>
		:root {
			color-scheme: dark;
			--black: #000;
			--near-black: #090909;
			--dark: #111;
			--line: #292929;
			--muted: #8a8a8a;
			--white: #f5f5f5;
		}

		* { box-sizing: border-box; }

		html, body { height: 100%; }

		body {
			margin: 0;
			background: var(--black);
			color: var(--white);
			font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			letter-spacing: 0;
		}

		button, textarea { font: inherit; }
		button { color: inherit; }

		.app {
			display: grid;
			grid-template-columns: 248px 1fr;
			height: 100%;
			min-height: 520px;
		}

		.sidebar {
			display: flex;
			flex-direction: column;
			border-right: 1px solid var(--line);
			background: var(--near-black);
			min-width: 0;
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 24px 20px 22px;
			border-bottom: 1px solid var(--line);
			font-weight: 700;
			letter-spacing: .08em;
			text-transform: uppercase;
		}

		.brand-mark {
			width: 10px;
			height: 10px;
			border: 2px solid var(--white);
			border-radius: 50%;
		}

		.new-chat {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin: 18px 14px 12px;
			padding: 10px 12px;
			border: 1px solid var(--line);
			background: transparent;
			cursor: pointer;
			text-align: left;
			transition: background .15s, border-color .15s;
		}

		.new-chat:hover, .new-chat:focus-visible { background: #1a1a1a; border-color: #555; }
		.new-chat:disabled { cursor: wait; opacity: .55; }
		.plus { font-size: 18px; line-height: 1; }

		.thread-list {
			display: flex;
			flex: 1;
			flex-direction: column;
			gap: 2px;
			overflow-y: auto;
			padding: 0 8px 16px;
		}

		.thread {
			width: 100%;
			overflow: hidden;
			padding: 10px 12px;
			border: 1px solid transparent;
			background: transparent;
			color: var(--muted);
			cursor: pointer;
			text-align: left;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.thread:hover { color: var(--white); background: #151515; }
		.thread.active { border-color: var(--line); color: var(--white); background: #151515; }

		.main {
			display: flex;
			min-width: 0;
			flex-direction: column;
			background: var(--black);
		}

		.topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			min-height: 66px;
			padding: 0 30px;
			border-bottom: 1px solid var(--line);
		}

		.topbar-title { font-size: 13px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
		.status { color: var(--muted); font-size: 11px; }

		.error-banner {
			display: none;
			margin: 14px 30px 0;
			padding: 10px 12px;
			border: 1px solid var(--white);
			background: var(--white);
			color: var(--black);
			overflow-wrap: anywhere;
		}

		.error-banner.visible { display: block; }

		.messages {
			display: flex;
			flex: 1;
			flex-direction: column;
			gap: 20px;
			width: min(860px, 100%);
			margin: 0 auto;
			padding: 34px 30px 28px;
			overflow-y: auto;
		}

		.empty-state {
			display: grid;
			flex: 1;
			place-items: center;
			color: var(--muted);
			text-align: center;
		}

		.empty-state strong { display: block; margin-bottom: 8px; color: var(--white); font-size: 19px; }

		.message { display: flex; gap: 12px; align-items: flex-start; }
		.message.user { justify-content: flex-end; }
		.message.assistant { justify-content: flex-start; }

		.avatar {
			display: grid;
			flex: 0 0 26px;
			width: 26px;
			height: 26px;
			place-items: center;
			border: 1px solid var(--white);
			color: var(--white);
			font-size: 11px;
			font-weight: 700;
		}

		.message-body { max-width: min(680px, 78%); min-width: 0; }
		.message.user .message-body { order: -1; }
		.message-label { margin-bottom: 5px; color: var(--muted); font-size: 10px; text-transform: uppercase; }
		.bubble { padding: 10px 13px; border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
		.message.user .bubble { border-color: #444; background: #171717; }
		.thinking { color: var(--muted); font-style: italic; }
		.thinking::after { content: ""; display: inline-block; width: 16px; animation: dots 1.2s infinite steps(4); }
		@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75%, 100% { content: "..."; } }

		.composer-wrap { padding: 0 30px 24px; }
		.composer { display: flex; width: min(860px, 100%); margin: 0 auto; border: 1px solid var(--line); background: var(--near-black); }
		.composer:focus-within { border-color: #666; }
		textarea { flex: 1; min-height: 48px; max-height: 160px; resize: none; padding: 14px; border: 0; outline: 0; background: transparent; color: var(--white); }
		textarea::placeholder { color: #666; }
		.send { align-self: flex-end; margin: 7px; padding: 8px 12px; border: 1px solid var(--white); background: var(--white); color: var(--black); cursor: pointer; font-weight: 700; }
		.send:hover, .send:focus-visible { background: #cfcfcf; }
		.send:disabled { cursor: wait; opacity: .45; }

		@media (max-width: 640px) {
			.app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
			.sidebar { max-height: 188px; border-right: 0; border-bottom: 1px solid var(--line); }
			.brand { padding: 14px 16px; }
			.new-chat { margin: 10px 14px 8px; }
			.thread-list { flex-direction: row; overflow-x: auto; padding-bottom: 10px; }
			.thread { flex: 0 0 150px; }
			.topbar { min-height: 52px; padding: 0 16px; }
			.messages { padding: 22px 16px; }
			.composer-wrap { padding: 0 16px 16px; }
			.error-banner { margin: 12px 16px 0; }
			.message-body { max-width: 85%; }
		}
	</style>
</head>
<body>
	<div class="app">
		<aside class="sidebar">
			<div class="brand"><span class="brand-mark" aria-hidden="true"></span> Coherent</div>
			<button class="new-chat" id="newChat" type="button"><span>+ New Chat</span><span class="plus" aria-hidden="true">+</span></button>
			<nav class="thread-list" id="threadList" aria-label="Chat threads"></nav>
		</aside>

		<main class="main">
			<header class="topbar">
				<span class="topbar-title">Script fact / flow checker</span>
				<span class="status" id="status">Ready</span>
			</header>
			<div class="error-banner" id="errorBanner" role="alert"></div>
			<section class="messages" id="messages" aria-live="polite"></section>
			<div class="composer-wrap">
				<form class="composer" id="composer">
					<textarea id="messageInput" rows="1" placeholder="Ask Coherent to check a script..." aria-label="Message"></textarea>
					<button class="send" id="sendButton" type="submit">Send</button>
				</form>
			</div>
		</main>
	</div>

	<script>
		// Replace this with the deployed Cloud Run service URL.
		const API_BASE = "https://coherent-915950250600.us-central1.run.app/";
		const APP_NAME = "coherent";
		const USER_ID = "demo-user";

		// When served via file://, fetch calls to a different origin may be blocked.
		// For local testing, serve this folder with: python -m http.server
		const threads = Object.create(null);
		let activeSessionId = null;
		let isBusy = false;

		const elements = {
			newChat: document.getElementById("newChat"),
			threadList: document.getElementById("threadList"),
			messages: document.getElementById("messages"),
			composer: document.getElementById("composer"),
			input: document.getElementById("messageInput"),
			send: document.getElementById("sendButton"),
			status: document.getElementById("status"),
			error: document.getElementById("errorBanner")
		};

		function showError(message) {
			elements.error.textContent = message;
			elements.error.classList.add("visible");
		}

		function clearError() {
			elements.error.textContent = "";
			elements.error.classList.remove("visible");
		}

		function setBusy(busy) {
			isBusy = busy;
			elements.send.disabled = busy;
			elements.newChat.disabled = busy;
			elements.input.disabled = busy;
			elements.status.textContent = busy ? "Thinking..." : "Ready";
		}

		async function createSession() {
			const response = await fetch(`${API_BASE}/apps/${APP_NAME}/users/${USER_ID}/sessions`, {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: "{}"
			});
			const responseText = await response.text();
			if (!response.ok) {
				throw new Error(`Session creation failed (${response.status} ${response.statusText}): ${responseText}`);
			}
			const session = JSON.parse(responseText);
			if (!session.id) throw new Error("Session creation failed: response did not include an id.");
			threads[session.id] = { id: session.id, label: `Chat ${Object.keys(threads).length + 1}`, messages: [] };
			activeSessionId = session.id;
			render();
			return session.id;
		}

		function renderThreads() {
			elements.threadList.replaceChildren();
			Object.values(threads).forEach((thread) => {
				const button = document.createElement("button");
				button.className = `thread${thread.id === activeSessionId ? " active" : ""}`;
				button.type = "button";
				button.textContent = thread.label;
				button.title = thread.label;
				button.addEventListener("click", () => {
					if (!isBusy) { activeSessionId = thread.id; clearError(); render(); }
				});
				elements.threadList.appendChild(button);
			});
		}

		function renderMessages() {
			elements.messages.replaceChildren();
			const thread = threads[activeSessionId];
			if (!thread || thread.messages.length === 0) {
				const empty = document.createElement("div");
				empty.className = "empty-state";
				empty.innerHTML = "<div><strong>What should we check?</strong>Send a scene, beat, or continuity question.</div>";
				elements.messages.appendChild(empty);
				return;
			}
			thread.messages.forEach((message) => {
				const row = document.createElement("div");
				row.className = `message ${message.role}`;
				const avatar = document.createElement("div");
				avatar.className = "avatar";
				avatar.textContent = message.role === "user" ? "Y" : "C";
				const body = document.createElement("div");
				body.className = "message-body";
				const label = document.createElement("div");
				label.className = "message-label";
				label.textContent = message.role === "user" ? "You" : "Coherent";
				const bubble = document.createElement("div");
				bubble.className = `bubble${message.thinking ? " thinking" : ""}`;
				bubble.textContent = message.text;
				body.append(label, bubble);
				row.append(message.role === "user" ? body : avatar, message.role === "user" ? avatar : body);
				elements.messages.appendChild(row);
			});
			elements.messages.scrollTop = elements.messages.scrollHeight;
		}

		function render() {
			renderThreads();
			renderMessages();
		}

		async function sendMessage(text) {
			const thread = threads[activeSessionId];
			if (!thread) return;
			clearError();
			thread.messages.push({ role: "user", text });
			if (thread.messages.length === 1) {
				thread.label = text.trim().slice(0, 30) || thread.label;
			}
			const assistantMessage = { role: "assistant", text: "", thinking: true };
			thread.messages.push(assistantMessage);
			render();
			setBusy(true);

			try {
				const response = await fetch(`${API_BASE}/run_sse`, {
					method: "POST",
					headers: { "Content-Type": "application/json" },
					body: JSON.stringify({
						appName: APP_NAME,
						userId: USER_ID,
						sessionId: thread.id,
						newMessage: { role: "user", parts: [{ text }] }
					})
				});
				if (!response.ok) {
					throw new Error(`Message failed (${response.status} ${response.statusText}): ${await response.text()}`);
				}
				if (!response.body) throw new Error("Message failed: the response did not include a stream.");
				const reader = response.body.getReader();
				const decoder = new TextDecoder();
				let buffer = "";
				assistantMessage.thinking = false;

				const consumeEvent = (line) => {
					if (!line.startsWith("data:")) return;
					const payload = line.slice(5).trim();
					if (!payload || payload === "[DONE]") return;
					const event = JSON.parse(payload);
					const parts = event.content && event.content.parts;
					if (Array.isArray(parts)) {
						parts.forEach((part) => { if (typeof part.text === "string") assistantMessage.text += part.text; });
						renderMessages();
					}
				};

				while (true) {
					const { value, done } = await reader.read();
					buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
					const lines = buffer.split(/\r?\n/);
					buffer = lines.pop() || "";
					lines.forEach(consumeEvent);
					if (done) break;
				}
				if (buffer.trim()) consumeEvent(buffer.trim());
				if (!assistantMessage.text) assistantMessage.text = "No response was returned.";
				renderMessages();
			} catch (error) {
				assistantMessage.thinking = false;
				assistantMessage.text = "The request could not be completed.";
				renderMessages();
				showError(error.message);
			} finally {
				setBusy(false);
				elements.input.focus();
			}
		}

		elements.newChat.addEventListener("click", async () => {
			clearError();
			setBusy(true);
			try { await createSession(); }
			catch (error) { showError(error.message); }
			finally { setBusy(false); elements.input.focus(); }
		});

		elements.composer.addEventListener("submit", (event) => {
			event.preventDefault();
			const text = elements.input.value.trim();
			if (!text || isBusy || !activeSessionId) return;
			elements.input.value = "";
			elements.input.style.height = "auto";
			sendMessage(text);
		});

		elements.input.addEventListener("keydown", (event) => {
			if (event.key === "Enter" && !event.shiftKey) {
				event.preventDefault();
				elements.composer.requestSubmit();
			}
		});

		elements.input.addEventListener("input", () => {
			elements.input.style.height = "auto";
			elements.input.style.height = `${Math.min(elements.input.scrollHeight, 160)}px`;
		});

		(async function initialize() {
			setBusy(true);
			try { await createSession(); }
			catch (error) { showError(error.message); }
			finally { setBusy(false); elements.input.focus(); }
		}());
	</script>
</body>
</html>
